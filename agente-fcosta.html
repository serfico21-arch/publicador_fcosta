<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agente FCosta Imóveis</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#161a23;--mu:#667085;--ac:#1877f2;--bd:#e4e7ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c25;--tx:#eef0f5;--mu:#98a2b3;--bd:#2a303d}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c25;--tx:#eef0f5;--mu:#98a2b3;--bd:#2a303d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tab{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
button.go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:600 16px inherit}
button.go:disabled{opacity:.6}
.out{white-space:normal;word-wrap:break-word;overflow-wrap:anywhere}
.out h2,.out h3{margin:16px 0 6px;font-size:17px}
.out p{margin:6px 0}.out ul,.out ol{padding-left:20px;margin:6px 0}
.out hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.err{color:#d92d20;font-size:14px}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
</style>
</head>
<body>
<main>
<a href="ferramentas.html" style="font-size:14px;color:var(--ac);text-decoration:none">← Voltar às ferramentas</a>
<h1>Agente FCosta Imóveis</h1>
<p class="sub">Anúncios, captação, lançamentos e conteúdo imobiliário para Facebook e Instagram, com a identidade da FCosta.</p>

<div class="card">
<label>Nome do negócio</label><input id="nome" value="FCosta Corretor">
<label>O que vende / serviço</label><textarea id="prod">Corretagem imobiliária: compra, venda e locação; lançamentos e portal do investidor; financiamento; avaliação (PTAM), perícia e consultoria judicial; chácara para eventos em Suzano; contratos e administração de imóveis.</textarea>
<div class="row">
<div><label>Cidade / região</label><input id="loc" value="Suzano e região, SP"></div>
<div><label>Orçamento diário (R$)</label><input id="orc" inputmode="numeric" placeholder="30"></div>
</div>
<div class="row">
<div><label>Objetivo</label><select id="obj"><option>Mensagens no WhatsApp</option><option>Captação de imóveis / proprietários</option><option>Vendas</option><option>Leads / contatos</option><option>Tráfego para site</option><option>Reconhecimento de marca</option></select></div>
<div><label>Tom de voz</label><select id="tom"><option>Próximo e amigável</option><option>Profissional</option><option>Divertido</option><option>Premium</option><option>Direto e urgente</option></select></div>
</div>
<label>Público / diferenciais (opcional)</label><textarea id="pub">Compradores, locatários, proprietários que querem vender ou alugar, investidores e organizadores de eventos. Atendimento direto com o corretor, segurança jurídica nos contratos, avaliação técnica (PTAM).</textarea>
</div>

<div class="tabs" id="tabs"></div>

<div class="card" id="extra" style="display:none">
<label id="extraL"></label><textarea id="extraT" style="min-height:110px"></textarea>
</div>

<button class="go" id="go">Gerar</button>
<div class="hint" id="hint"></div>

<div class="card out" id="res" style="display:none;margin-top:14px">
<div id="txt"></div>
<div class="tools"><button id="cp">Copiar</button><button id="dl">Baixar .txt</button></div>
</div>
</main>
<script>
// Troque pelo endereço do seu site no Netlify se colar esta página no Hostinger:
const ENDPOINT="/.netlify/functions/agente-ia";
const CTX=`Corretor: Sergio Fernandes da Costa, CRECI-SP 294791-F, CNAI 52708. Marca: FCosta. Site: fcostacorretor.com. WhatsApp: wa.me/5511993509109. Instagram @f.cost.a_corretor, YouTube @fcostacorretor, TikTok @fcosta.corretor, Facebook SergioCostaRCM. Identidade visual: azul-céu #3B9BD6, branco e azul-marinho #1E3A5F (nunca vermelho ou dourado escuro). Serviços do site: comprar, alugar, lançamentos, portal do investidor, financiamento, chácara para eventos em Suzano, PTAM/avaliação, perícia e judicial, consultoria, contratos, inquilinato, documentação, cartório, panfletos, blog, vídeos. REGRAS: anúncios de imóveis entram na categoria especial Habitação do Meta, que NÃO permite segmentar por idade, gênero ou CEP e limita interesses; sugira segmentação por localização ampla (raio mínimo de 25 km), conteúdo e criativo. Todo anúncio deve conter nome do corretor e CRECI. Nunca prometa valorização, rentabilidade, aprovação de crédito ou desconto garantido. Não use dados pessoais de terceiros.`;
const MODES={
livre:{n:"Agente I.A. (livre)",req:1,x:"Pergunte ou peça o que quiser (anúncio, resposta a cliente, legenda, explicação, ideia...):",p:"Atenda ao pedido abaixo como assistente do corretor, de forma prática e pronta para usar, aplicando o contexto fixo da marca."},
imovel:{n:"Anúncio de imóvel",req:1,x:"Dados do imóvel (tipo, bairro, metragem, quartos, vagas, valor, diferenciais, venda ou aluguel):",p:"Crie o pacote de divulgação deste imóvel: 3 textos principais para anúncio Meta (curto, médio, storytelling), 3 títulos, descrição, CTA para WhatsApp com mensagem pré-preenchida, legenda para feed com hashtags locais, roteiro de 30s para Reels, texto para stories (3 telas), sugestão de fotos e ordem, e descrição completa para portais. Inclua CRECI e nunca invente informações que não foram dadas."},
captacao:{n:"Captação de proprietários",p:"Monte uma campanha de captação de imóveis para venda e locação: 5 anúncios para proprietários (ângulos: avaliação gratuita, venda rápida, segurança jurídica, administração de aluguel, vendeu na região), roteiro de vídeo de autoridade, landing/mensagem de WhatsApp, script de primeiro contato e 3 follow-ups, objeções comuns com respostas e argumentos para exclusividade."},
lancamento:{n:"Lançamentos e investidor",p:"Crie uma estratégia para divulgar lançamentos e o portal do investidor: funil (atração, nutrição, visita/plantão), 5 anúncios, conteúdo educativo (financiamento, ITBI, escritura, FGTS), roteiro de mensagens de WhatsApp para qualificar o lead (renda, entrada, prazo) e e-mail/WhatsApp de follow-up. Sem promessas de rentabilidade."},
chacara:{n:"Chácara para eventos",p:"Crie campanha para divulgar a chácara para eventos em Suzano: 5 anúncios (casamento, aniversário, confraternização de empresa, batizado, churrasco em família), ideias de criativos (fotos, vídeo tour), calendário de datas sazonais, oferta de pacote, roteiro de atendimento no WhatsApp e perguntas para qualificar (data, convidados, tipo de evento)."},
servicos:{n:"PTAM, avaliação e judicial",p:"Crie conteúdo e anúncios para os serviços técnicos: PTAM (parecer técnico de avaliação mercadológica), avaliação de imóveis, perícia e assessoria judicial. Público: advogados, bancos, inventários, divórcios, partilhas e proprietários. Inclua 4 anúncios, 5 posts educativos, 2 roteiros de vídeo, texto de apresentação para LinkedIn e mensagem de prospecção para escritórios de advocacia. Tom técnico e confiável, sem prometer resultado judicial."},
reels:{n:"Roteiros de vídeo",x:"Tema ou imóvel (opcional):",p:"Escreva 6 roteiros de vídeos curtos (15 a 45s) para Reels, TikTok e YouTube Shorts: gancho nos 3 primeiros segundos, cenas, falas, texto na tela, trilha sugerida e CTA. Misture tour de imóvel, dica de financiamento, bastidores, mitos do mercado e prova social."},

campanha:{n:"Campanha completa",p:"Monte um plano de campanha completo no Meta Ads: estrutura (campanhas, conjuntos, anúncios), objetivo e otimização recomendados, divisão do orçamento, 3 públicos (frio, morno, remarketing) com segmentações detalhadas, posicionamentos, 3 ideias de criativo (imagem/vídeo/carrossel com roteiro), textos principais, métricas-alvo realistas, plano de teste A/B dos primeiros 7 dias e regras de quando escalar ou pausar."},
anuncios:{n:"Textos de anúncio",p:"Escreva 5 variações de anúncio (texto principal, título, descrição e CTA recomendado), cada uma com um ângulo diferente: dor, benefício, prova social, oferta/urgência e curiosidade. Respeite os limites de caracteres do Meta e evite promessas que violem as políticas de anúncios. Sugira também 3 variações de título curtas."},
posts:{n:"Calendário de posts",p:"Crie um calendário de conteúdo de 14 dias para Facebook e Instagram: para cada dia, formato (feed, reels, stories, carrossel), tema, gancho de abertura, legenda pronta com CTA e sugestão visual. Equilibre educar, engajar, provar e vender."},
publicos:{n:"Públicos e segmentação",p:"Defina a estratégia de públicos: 5 interesses/comportamentos detalhados para teste, 2 públicos semelhantes (lookalike) com a origem ideal, públicos personalizados para remarketing (com janelas de tempo), exclusões importantes, e uma ordem de testes com orçamento sugerido por público."},
metricas:{n:"Analisar métricas",p:"Analise as métricas colando abaixo. Diagnostique o gargalo (criativo, público, oferta, página ou orçamento), compare com benchmarks realistas do mercado brasileiro, indique o que pausar, manter e escalar, e liste as 5 ações priorizadas para os próximos 7 dias. Seja específico e honesto, sem inventar números que não foram informados.",req:1,x:"Cole aqui suas métricas (gasto, impressões, cliques, CTR, CPC, CPM, conversões, CPA, frequência, por campanha/anúncio):"},
comunidade:{n:"Comunidade e respostas",p:"Responda aos comentários e mensagens colados abaixo no tom da marca, um por um, mantendo cada resposta curta, útil e com CTA quando fizer sentido. Para reclamações, use um roteiro de contorno. Ao final, sugira 5 respostas rápidas salvas para perguntas frequentes (preço, localização, prazo, pagamento, como comprar).",req:1,x:"Cole aqui os comentários/mensagens recebidos (um por linha):"},
ideias:{n:"Ideias rápidas",p:"Gere 20 ideias de posts e anúncios criativos para esse negócio, agrupadas por objetivo (atrair, engajar, converter, fidelizar), cada uma com gancho de uma linha.",x:"Algum tema, data comemorativa ou promoção para considerar? (opcional)"}
};
let mode=location.hash==="#ia"?"livre":"imovel",last="";
const $=id=>document.getElementById(id);
const tabs=$("tabs");
Object.keys(MODES).forEach(k=>{const b=document.createElement("button");b.className="tab"+(k===mode?" on":"");b.textContent=MODES[k].n;b.onclick=()=>{mode=k;[...tabs.children].forEach(c=>c.classList.remove("on"));b.classList.add("on");sel()};tabs.appendChild(b)});
function sel(){const m=MODES[mode];$("extra").style.display=m.x?"block":"none";$("extraL").textContent=m.x||""}
sel();
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(s){
 const L=esc(s).split("\n");let h="",ul=false,ol=false;
 const inl=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
 const close=()=>{if(ul){h+="</ul>";ul=false}if(ol){h+="</ol>";ol=false}};
 for(const l of L){let m;
  if(m=l.match(/^#{1,2}\s+(.*)/)){close();h+="<h2>"+inl(m[1])+"</h2>"}
  else if(m=l.match(/^#{3,}\s+(.*)/)){close();h+="<h3>"+inl(m[1])+"</h3>"}
  else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(!ul){close();h+="<ul>";ul=true}h+="<li>"+inl(m[1])+"</li>"}
  else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(!ol){close();h+="<ol>";ol=true}h+="<li>"+inl(m[1])+"</li>"}
  else if(/^---+$/.test(l.trim())){close();h+="<hr>"}
  else if(l.trim()===""){close()}
  else{close();h+="<p>"+inl(l)+"</p>"}}
 close();return h}
$("go").onclick=async()=>{
 const btn=$("go"),hint=$("hint");hint.className="hint";hint.textContent="";
 if(!$("nome").value.trim()||!$("prod").value.trim()){hint.className="hint err";hint.textContent="Preencha o nome do negócio e o que você vende.";return}
 const m=MODES[mode];
 if(m.req&&!$("extraT").value.trim()){hint.className="hint err";hint.textContent="Preencha o campo extra acima.";return}
 const prompt=`Você é um estrategista sênior de marketing imobiliário e mídia paga, especialista em Facebook, Instagram e Meta Ads no Brasil, conhecendo a política de anúncios de Habitação e o código de ética do CRECI. Responda em português do Brasil, em Markdown, de forma prática, específica e pronta para usar, sem enrolação e sem prometer resultados garantidos.

NEGÓCIO: ${$("nome").value}
PRODUTO/SERVIÇO: ${$("prod").value}
LOCAL: ${$("loc").value||"não informado"}
ORÇAMENTO DIÁRIO: R$ ${$("orc").value||"não informado"}
OBJETIVO: ${$("obj").value}
TOM DE VOZ: ${$("tom").value}
PÚBLICO/DIFERENCIAIS: ${$("pub").value||"não informado"}
CONTEXTO FIXO DA MARCA: ${CTX}

TAREFA: ${m.p}
${m.x?"\nCONTEÚDO DO CLIENTE:\n"+$("extraT").value:""}`;
 btn.disabled=true;btn.textContent="Gerando...";$("res").style.display="block";$("txt").innerHTML="<p class='hint'>Pensando...</p>";
 try{
  const resp=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const r=await resp.json();
  if(!resp.ok)throw {code:resp.status===429?"rate_limited":"erro"};
  last=r.text;$("txt").innerHTML=md(last);
 }catch(e){
  if(e&&e.text){last=e.text;$("txt").innerHTML=md(last)}
  hint.className="hint err";hint.textContent=e&&e.code==="rate_limited"?"Muitas solicitações. Aguarde um pouco.":"Não foi possível gerar agora. Tente de novo.";
 }
 btn.disabled=false;btn.textContent="Gerar";
 $("res").scrollIntoView({behavior:"smooth",block:"start"});
};
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText(last);$("cp").textContent="Copiado ✓"}catch(e){$("cp").textContent="Selecione e copie"}setTimeout(()=>$("cp").textContent="Copiar",1500)};
$("dl").onclick=()=>{const u=URL.createObjectURL(new Blob([last],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="fcosta-"+mode+".txt";a.click();URL.revokeObjectURL(u)};
</script>
</body>
</html>
