<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCosta Corretor | Central de Ferramentas</title>
<style>
:root{--azul:#3B9BD6;--marinho:#1E3A5F;--bg:#f0f4f8;--bd:#dbe3ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--marinho);font:16px/1.5 Arial,Helvetica,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--marinho);color:#fff;padding:calc(18px + env(safe-area-inset-top,0)) 16px 22px;text-align:center}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;font-size:13px;opacity:.85}
main{max-width:820px;margin:0 auto;padding:16px}
.ag{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:20px}
@media(min-width:600px){.ag{grid-template-columns:1fr 1fr}}
.ag a{display:block;text-decoration:none;border-radius:16px;padding:18px;color:#fff;box-shadow:0 6px 16px rgba(30,58,95,.2)}
.ag .a1{background:var(--azul)}.ag .a2{background:var(--marinho)}
.ag b{display:block;font-size:18px}.ag span{font-size:13px;opacity:.92}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;font:inherit;margin-bottom:14px}
h2{font-size:15px;margin:18px 0 8px;border-bottom:2px solid var(--azul);padding-bottom:4px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:600px){.g{grid-template-columns:repeat(3,1fr)}}
.g a{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px 10px;text-align:center;text-decoration:none;color:var(--marinho);font-weight:700;font-size:14px}
.g a:active{background:var(--azul);color:#fff}
.g a small{display:block;font-weight:400;font-size:11px;color:#667;margin-top:2px}
footer{text-align:center;font-size:12px;color:#667;padding:20px 16px 30px}
footer a{color:var(--azul);text-decoration:none}
</style>
</head>
<body>
<header>
<h1>FCosta Corretor</h1>
<p>Sergio Fernandes da Costa · CRECI-SP 294791-F · CNAI 52708</p>
</header>
<main>
<div class="ag">
<a class="a1" href="agente-fcosta.html"><b>Agente FCosta</b><span>Anúncios, captação, lançamentos e conteúdo para Facebook e Instagram</span></a>
<a class="a2" href="agente-fcosta.html#ia"><b>Agente I.A.</b><span>Pergunte ou peça o que quiser, com o contexto da FCosta</span></a>
</div>
<input id="q" type="search" placeholder="Buscar ferramenta...">
<div id="lista"></div>
</main>
<footer>
<a href="https://wa.me/5511993509109">WhatsApp</a> · <a href="https://fcostacorretor.com">fcostacorretor.com</a>
</footer>
<script>
var G=[
["Divulgação",[["Publicador","publicador-fcosta.html","Publicar imóveis"],["Painel de divulgação","painel-divulgacao.html","Acompanhar"],["Publicação","publicacao.html",""],["Anunciar","anunciar.html",""],["Tráfego","trafego.html","Anúncios pagos"],["Kit do corretor","kit-corretor.html",""]]],
["Imóveis e mídia",[["Tour de imóveis","tour-imoveis.html",""],["Editor de fotos","foto-editor.html",""],["Portfólio","portfolio.html",""],["Portfólio FCosta","portfolio-fcosta.html",""],["TV FCosta","tv-fcosta.html",""],["TV Costa","tv_costa.html",""]]],
["Gestão",[["Ferramentas","ferramentas.html","Todas as ferramentas"],["FCosta Corretor","FCosta_Corretor.html",""],["Painel ADM","painel_adm.html","Acesso restrito"],["Portfólio Admin","portfolio-admin.html","Acesso restrito"]]]
];
var el=document.getElementById("lista");
function draw(t){
 t=(t||"").toLowerCase();el.innerHTML="";
 G.forEach(function(g){
  var it=g[1].filter(function(i){return !t||(i[0]+" "+i[2]).toLowerCase().indexOf(t)>-1});
  if(!it.length)return;
  var h=document.createElement("h2");h.textContent=g[0];el.appendChild(h);
  var d=document.createElement("div");d.className="g";
  it.forEach(function(i){var a=document.createElement("a");a.href=i[1];a.textContent=i[0];if(i[2]){var s=document.createElement("small");s.textContent=i[2];a.appendChild(s)}d.appendChild(a)});
  el.appendChild(d);
 });
}
document.getElementById("q").oninput=function(){draw(this.value)};
draw();
</script>
</body>
</html>
